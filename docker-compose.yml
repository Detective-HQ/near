services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: udi
      POSTGRES_PASSWORD: udi
      POSTGRES_DB: udi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U udi -d udi"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://udi:udi@postgres:5432/udi?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/api"]
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      APP_ENV: production
      HTTP_ADDR: :8081
      DATABASE_URL: postgres://udi:udi@postgres:5432/udi?sslmode=disable
      REDIS_URL: redis://redis:6379
      SWAP_QUOTE_MODE: demo
      ENABLE_LIVE_EXECUTION: "false"
      MARKET_DATA_MODE: live
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/bin/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/worker"]
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://udi:udi@postgres:5432/udi?sslmode=disable
      REDIS_URL: redis://redis:6379
      SWAP_QUOTE_MODE: demo
      ENABLE_LIVE_EXECUTION: "false"
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "/bin/worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_HOST: 0.0.0.0
      NEXT_PORT: 3000
      UDI_API_ORIGIN: http://api:8081
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
