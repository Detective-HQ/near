services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8081:8081"
    environment:
      APP_ENV: production
      HTTP_ADDR: 0.0.0.0:8081
      LOG_LEVEL: info
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_HOST: 0.0.0.0
      NEXT_PORT: 3000
      UDI_API_ORIGIN: http://backend:8081
    depends_on:
      - backend
    restart: unless-stopped
