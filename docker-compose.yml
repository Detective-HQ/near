# Local production-like stack. Credentials default to development values;
# override them with environment variables (or a .env next to this file).
# Database, Redis and the API are bound to 127.0.0.1 only: the browser talks to
# the web container, which proxies to the API over the internal network.

x-backend-env: &backend-env
  APP_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-udi}:${POSTGRES_PASSWORD:-udi}@postgres:5432/${POSTGRES_DB:-udi}?sslmode=disable
  REDIS_URL: redis://redis:6379
  SWAP_QUOTE_MODE: ${SWAP_QUOTE_MODE:-demo}
  ENABLE_LIVE_EXECUTION: ${ENABLE_LIVE_EXECUTION:-false}
  ONECLICK_JWT: ${ONECLICK_JWT:-}
  ONECLICK_QUOTE_PUBLIC_KEY: ${ONECLICK_QUOTE_PUBLIC_KEY:-}
  MARKET_DATA_MODE: ${MARKET_DATA_MODE:-fixture}
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-udi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udi}
      POSTGRES_DB: ${POSTGRES_DB:-udi}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [udi]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [udi]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/migrate"]
    command: ["up"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    networks: [udi]

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/api"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      <<: *backend-env
      HTTP_ADDR: :8081
      # Only the internal Compose network may set X-Forwarded-For.
      TRUSTED_PROXY_CIDRS: 172.28.0.0/16
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      ANALYTICS_SNAPSHOT_DIR: /tmp/udi-snapshots
    healthcheck:
      test: ["CMD", "/bin/api", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [udi]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    entrypoint: ["/bin/worker"]
    restart: unless-stopped
    environment:
      <<: *backend-env
    healthcheck:
      test: ["CMD", "/bin/worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [udi]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_HOST: 0.0.0.0
      NEXT_PORT: 3000
      UDI_API_ORIGIN: http://api:8081
    depends_on:
      api:
        condition: service_healthy
    networks: [udi]

networks:
  udi:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres_data:
  redis_data:
