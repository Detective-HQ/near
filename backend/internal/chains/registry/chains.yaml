# Single source of truth for supported chains.
#
# Feature-flag semantics:
#   swap_enabled      - server-side executable swaps may be routed here
#   deposit_supported - deposit address/memo capture is supported
#   memo_required     - executable quotes must carry a deposit memo
#   wallet_only       - non-custodial wallet payloads only; server never signs
#   planned           - advertised in the registry but not enabled for swaps
#
# Keep this file free of secrets. RPC URLs must be public HTTPS endpoints.
chains:
  - key: ethereum
    aliases: [eth]
    name: Ethereum
    family: evm
    chain_id: "1"
    rpc_urls:
      - https://ethereum-rpc.publicnode.com
      - https://eth.llamarpc.com
    explorer_tx_url: https://etherscan.io/tx/{hash}
    explorer_address_url: https://etherscan.io/address/{address}
    native_currency:
      symbol: ETH
      decimals: 18
    features:
      swap_enabled: true
      deposit_supported: true
      memo_required: false
      wallet_only: false
      planned: false

