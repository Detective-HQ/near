openapi: 3.1.0
info:
  title: Universal DeFi Intelligence Local API
  version: 0.1.0
  description: Local prototype API with fixture data, optional DeFiLlama analytics, optional NEAR Intents quotes, and an opt-in EVM wallet deposit lifecycle. Live execution is disabled by default; the API does not authenticate users or independently verify source-chain receipts.
servers:
  - url: http://127.0.0.1:8081
paths:
  /api/v1/health:
    get:
      summary: Local process health and configured data modes
      responses:
        "200":
          description: Includes quoteMode, marketDataMode, liveQuotesConfigured, and the computed executionEnabled flag. Never includes credentials.
  /api/v1/chains:
    get:
      summary: Configured chain registry
      responses:
        "200":
          description: Chain registry flags. EVM swap flags are enabled only when the server execution gate is active; a pair still requires a provider quote.
  /api/v1/assets:
    get:
      summary: Fixture catalogue or current 1Click provider catalogue
      parameters:
        - in: query
          name: chain
          schema:
            type: string
      responses:
        "200":
          description: Fixture IDs in demo mode; exact provider asset IDs in live mode. Catalogue presence does not guarantee a route.
        "503":
          description: Provider catalogue unavailable.
  /api/v1/markets/overview:
    get:
      summary: Fixture overview or optional live NEAR ecosystem analytics
      parameters:
        - in: query
          name: refresh
          description: Set to true to bypass the live market-data cache.
          schema:
            type: boolean
      responses:
        "200":
          description: Fixture metrics or live DeFiLlama metrics with source, retrieval time, status, and methodology version.
        "503":
          description: Live provider adapter is not configured.
  /api/v1/intelligence/near:
    get:
      summary: Fixture or live NEAR metric dictionary
      responses:
        "200":
          description: Fixture values or the cached live DeFiLlama snapshot. Missing observations remain null and are not replaced with fixtures.
  /api/v1/research/scenarios:
    get:
      summary: Scenario assumptions and formula
      responses:
        "200":
          description: Fictional assumptions for reproducible UI calculation.
  /api/v1/activity:
    get:
      summary: Prototype swap activity
      responses:
        "200":
          description: Saved simulation and live-prototype records. No user ownership filter is applied.
  /api/v1/quotes:
    post:
      summary: Create a demo estimate or live provider dry quote
      description: In live mode, requests only a dry=true exact-input quote. Executable quotes are requested separately by POST /api/v1/swaps and require the execution gate.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [originAssetId, destinationAssetId, amountIn]
              properties:
                originAssetId:
                  type: string
                destinationAssetId:
                  type: string
                amountIn:
                  type: string
                  pattern: "^\\d+(\\.\\d+)?$"
                  description: Human decimal amount; server converts using selected asset decimals.
                recipient:
                  type: string
                  maxLength: 256
                  description: Required in live mode; must be a valid EVM address for the current live quote slice.
                refundTo:
                  type: string
                  maxLength: 256
                  description: Required in live mode; must be a valid EVM address for the current live quote slice.
                slippageBps:
                  type: integer
                  minimum: 0
                  maximum: 5000
                  default: 100
      responses:
        "200":
          description: Live provider dry quote with no deposit instructions.
        "201":
          description: Local fixture estimate; no deposit instructions are returned.
        "400":
          description: Invalid asset, amount, or precision.
        "502":
          description: Provider unavailable, malformed, or invalid response.
        "503":
          description: Provider credentials are not configured, provider is rate-limited, or demo writes are disabled.
  /api/v1/swaps:
    post:
      summary: Create a simulated record or executable live quote
      description: Demo mode creates a local simulation. Live mode requires an EVM pair, server-side NEAR Intents partner JWT, and ENABLE_LIVE_EXECUTION=true; it requests and verifies a fresh executable quote but does not sign or broadcast.
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId:
                  type: string
                  description: ID of the provider dry quote in live mode or fixture quote in demo mode.
                recipient:
                  type: string
                  description: Required in live mode; EVM destination address.
                refundTo:
                  type: string
                  description: Required in live mode; EVM refund address.
      responses:
        "200":
          description: Existing swap returned for a repeated idempotency key.
        "201":
          description: New simulation record or live swap awaiting user deposit.
        "400":
          description: Invalid request, missing idempotency key, or expired quote.
        "503":
          description: Live execution is disabled, provider credential is unavailable, or demo writes are disabled.
  /api/v1/swaps/{id}:
    get:
      summary: Get a simulation or live-prototype swap
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: State, event history, provider status, and separate transaction references when present.
        "404":
          description: Swap not found.
  /api/v1/swaps/{id}/deposit:
    post:
      summary: Record a wallet-reported EVM deposit transaction
      description: Records a transaction hash, optionally notifies the provider, and relies on provider status polling for settlement. The source transaction is not independently verified against an RPC.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [txHash, chainId]
              properties:
                txHash:
                  type: string
                  pattern: "^0x[a-fA-F0-9]{64}$"
                chainId:
                  type: string
                  description: Decimal EVM chain ID for the quoted source asset.
      responses:
        "200":
          description: Duplicate report of the same source transaction hash.
        "202":
          description: Source hash recorded; provider settlement is pending.
        "404":
          description: Swap not found.
        "409":
          description: Wrong state, duplicate hash on another swap, or conflicting source transaction.
        "503":
          description: Live execution is disabled.
  /api/v1/swaps/{id}/cancel:
    post:
      summary: Discard unfunded executable quote instructions
      description: Does not cancel an on-chain transaction. Only allowed before a source transaction is recorded.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Instructions marked cancelled or expired.
        "404":
          description: Swap not found.
        "409":
          description: A deposit was already recorded or the swap is not awaiting a deposit.
  /api/v1/swaps/{id}/simulate:
    post:
      summary: Advance a local-only demo lifecycle
      description: Disabled in live quote mode; this endpoint never submits deposits or provider status.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One simulated transition; this is not provider settlement.
        "400":
          description: Simulation is already in its final state.
        "503":
          description: Live execution is unavailable or demo mode is disabled.
